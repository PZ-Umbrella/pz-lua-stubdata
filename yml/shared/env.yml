version: "1.1"
languages:
  lua:
    classes:
      math:
        tags:
          - StubGen_NoInitializer
        staticMethods:
          - name: sign
            parameters:
              - name: x
                type: number
            return:
              - type: number
          - name: length2sq
            parameters:
              - name: x
                type: number
              - name: y
                type: number
            return:
              - type: number
          - name: length2
            parameters:
              - name: x
                type: number
              - name: y
                type: number
            return:
              - type: number
          - name: rangesOverlap
            parameters:
              - name: a1
                type: number
              - name: a2
                type: number
              - name: b1
                type: number
              - name: b2
                type: number
            return:
              - type: boolean
          - name: isBetweenInclusive
            parameters:
              - name: val
                type: number
              - name: min
                type: number
              - name: max
                type: number
            return:
              - type: boolean
          - name: clamp
            parameters:
              - name: val
                type: number
              - name: min
                type: number
              - name: max
                type: number
            return:
              - type: number
    functions:
      - name: round
        parameters:
          - name: num
            type: number
          - name: idp
            type: integer
            nullable: true
        return:
          - type: number
      - name: xpairs
        parameters:
          - name: _t
            type: ArrayList | table
        return:
          - type: "fun(): integer?, unknown?"
      - name: logTo01
        parameters:
          - name: value
            type: number
        return:
          - type: number
      - name: round2
        parameters:
          - name: num
            type: number
          - name: idp
            type: integer
            nullable: true
        return:
          - type: number
      - name: strsplit
        parameters:
          - name: inputstr
            type: string
          - name: sep
            type: string
            nullable: true
        return:
          - type: string[]
      - name: findFunction
        parameters:
          - name: _s
            type: string
          - name: _parent
            type: table
            nullable: true
        return:
          - type: function
            nullable: true
      - name: namedColorToTable
        parameters:
          - name: _name
            type: string
        return:
          - type: umbrella.RGBA
      - name: colorToTable
        parameters:
          - name: _c
        return:
          - type: umbrella.RGBA
      - name: safeColorToTable
        parameters:
          - name: _c
        return:
          - type: umbrella.RGBA
      - name: onMouseWheelScrollHandler
        parameters:
          - name: _self
            type: ISUIElement
          - name: _del
            type: number
        return:
          - type: boolean
      - name: isTable
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<table>
      - name: isFunction
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<function>
      - name: isNil
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<nil>
      - name: isBoolean
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<boolean>
      - name: isNumber
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<number>
      - name: isString
        parameters:
          - name: object
            type: any
        return:
          - type: TypeGuard<string>
