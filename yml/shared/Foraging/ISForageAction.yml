version: "1.1"
languages:
  lua:
    classes:
      ISForageAction:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: iconID
                type: string
              - name: itemDataList
                type: table[]
              - name: targetContainer
                type: ItemContainer
              - name: itemType
                type: string
        staticFields:
          Type:
            defaultValue: '"ISForageAction"'
        fields:
          targetContainer:
            type: ItemContainer
          itemType:
            type: string
          itemDataList:
            type: table[]
          manager:
            type: ISSearchManager
          forageIcon:
            type: ISForageIcon
          zoneData:
            type: umbrella.Foraging.ZoneData
            nullable: true
          iconID:
            type: string
          itemDef:
            type: umbrella.Foraging.ItemDefinition
          currentTime:
            type: number
          started:
            type: boolean
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: stop
          - name: start
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
