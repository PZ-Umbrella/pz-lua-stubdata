version: "1.1"
languages:
  lua:
    classes:
      ISDryMyself:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: item
                type: InventoryItem
        staticFields:
          Type:
            defaultValue: '"ISDryMyself"'
        fields:
          lastUse:
            type: number
          item:
            type: InventoryItem
            nullable: true
          started:
            type: boolean
          useDelay:
            type: number
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: update
          - name: useAndDry
            parameters:
              - name: isSyncNeeded
                type: boolean
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: serverStart
          - name: animEvent
            parameters:
              - name: event
              - name: parameter
          - name: getDuration
            return:
              - type: number
