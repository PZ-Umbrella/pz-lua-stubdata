version: "1.1"
languages:
  lua:
    classes:
      ISPlaceFishingNetAction:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
              - name: item
              - name: square
                type: IsoGridSquare
              - name: sprite
        staticFields:
          Type:
            defaultValue: '"ISPlaceFishingNetAction"'
        fields:
          item: {}
          square:
            type: IsoGridSquare
          sprite: {}
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: unknown
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
