version: "1.1"
languages:
  lua:
    classes:
      ISPlaceFishingNetAction:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: item
                type: InventoryItem
              - name: square
                type: IsoGridSquare
              - name: sprite
                type: IsoSprite
        staticFields:
          Type:
            defaultValue: '"ISPlaceFishingNetAction"'
        fields:
          item:
            type: InventoryItem
          square:
            type: IsoGridSquare
          sprite:
            type: IsoSprite
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
