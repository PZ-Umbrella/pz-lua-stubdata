version: "1.1"
languages:
  lua:
    classes:
      ISThrowCorpseOverFence:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: fence
                type: IsoObject
              - name: dir
                type: IsoDirections
        staticFields:
          Type:
            defaultValue: '"ISThrowCorpseOverFence"'
        fields:
          fence:
            type: IsoObject
          dir:
            type: IsoDirections
          allowedWhileDraggingCorpses:
            type: boolean
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
