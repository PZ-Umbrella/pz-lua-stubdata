version: "1.1"
languages:
  lua:
    classes:
      ISButcherAnimal:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: body
                type: IsoDeadBody
              - name: bodyItemToRemove
                type: InventoryItem
                nullable: true
        staticFields:
          Type:
            defaultValue: '"ISButcherAnimal"'
        fields:
          sound:
            type: integer
          body:
            type: IsoDeadBody
          perkLevel:
            type: integer
          bodyItemToRemove:
            type: InventoryItem | false
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: serverStart
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
          - name: stopSound
          - name: isLargeAnimal
            parameters:
              - name: corpse
                type: IsoDeadBody
            return:
              - type: boolean
