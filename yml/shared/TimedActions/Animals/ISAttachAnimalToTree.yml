version: "1.1"
languages:
  lua:
    classes:
      ISAttachAnimalToTree:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: animal
                type: IsoAnimal
              - name: tree
                type: IsoObject
              - name: remove
                type: boolean
        staticFields:
          Type:
            defaultValue: '"ISAttachAnimalToTree"'
        fields:
          sound:
            type: integer
            nullable: true
          animal:
            type: IsoAnimal
          remove:
            type: boolean
          tree:
            type: IsoObject
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: takeRope
          - name: attachRope
          - name: getRopeToRemoveFromInventory
            return:
              - type: unknown
                nullable: true
          - name: getRopeNotInHand
            parameters:
              - name: ropes
            return:
              - type: unknown
                nullable: true
          - name: getDuration
            return:
              - type: number
