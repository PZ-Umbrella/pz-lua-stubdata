version: "1.1"
languages:
  lua:
    classes:
      ISPickAxeGroundCoverItem:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: item
                type: IsoObject | IsoWorldInventoryObject
        staticFields:
          Type:
            defaultValue: '"ISPickAxeGroundCoverItem"'
        fields:
          spriteFrame:
            type: number
          pickAxe:
            type: InventoryItem
            nullable: true
          started:
            type: boolean
          item:
            type: IsoObject | IsoWorldInventoryObject
          objectType:
            type: string
            nullable: true
          cornerCounter:
            type: number
        methods:
          - name: predicatePickAxe
            parameters:
              - name: item
                type: InventoryItem
            return:
              - type: boolean
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
                nullable: true
          - name: animEvent
            parameters:
              - name: event
                type: string
              - name: parameter
                type: string
          - name: isMineralDeposit
            return:
              - type: boolean
