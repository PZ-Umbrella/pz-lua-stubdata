version: "1.1"
languages:
  lua:
    classes:
      RecMedia:
        fields:
          "[string]":
            type: table<string, umbrella.RecMediaItem>
      umbrella.RecMediaItem:
        fields:
          itemDisplayName:
            type: string
          title:
            type: string
          subtitle:
            type: string
            nullable: true
          category:
            type: string
          author:
            type: string
            nullable: true
          extra:
            type: string
            nullable: true
          spawning:
            type: 0 | 1 | 2
            nullable: true
            notes: |-
              Defines the rarity of the recorded media items.
              0 = common, 1 = uncommon, 2 = rare (weights: 700, 300, 100)
      umbrella.RecMediaLine:
        fields:
          text:
            type: string
          r:
            type: number
          g:
            type: number
          b:
            type: number
          codes:
            type: string
