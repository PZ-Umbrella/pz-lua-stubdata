version: "1.1"
languages:
  lua:
    classes:
      ISInflateTire:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: part
                type: VehiclePart
              - name: item
                type: InventoryItem
              - name: psiTarget
                type: number
        staticFields:
          Type:
            defaultValue: '"ISInflateTire"'
        fields:
          totalPsi:
            type: number
          psiSent:
            type: number
            nullable: true
          part:
            type: VehiclePart
          vehicle:
            type: BaseVehicle
          psiStart:
            type: number
          item:
            type: InventoryItem
          psiTarget:
            type: number
          jobType:
            type: string
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: update
            return:
              - type: boolean
                nullable: true
          - name: start
          - name: stop
          - name: serverStop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
