version: "1.1"
languages:
  lua:
    classes:
      ISUninstallVehiclePart:
        extends: ISBaseTimedAction
        constructors:
          - parameters:
              - name: character
                type: IsoPlayer
              - name: part
                type: VehiclePart
              - name: workTime
                type: number
        staticFields:
          Type:
            defaultValue: '"ISUninstallVehiclePart"'
        fields:
          part:
            type: VehiclePart
          vehicle:
            type: BaseVehicle
          jobType:
            type: string
          workTime:
            type: number
        methods:
          - name: isValid
            return:
              - type: boolean
          - name: waitToStart
            return:
              - type: boolean
          - name: update
          - name: start
          - name: stop
          - name: perform
          - name: complete
            return:
              - type: boolean
          - name: getDuration
            return:
              - type: number
