version: "1.1"
languages:
  lua:
    classes:
      SpawnRegionMgr:
        staticMethods:
          - name: loadSpawnPointsFile
            parameters:
              - name: filename
                type: string
              - name: server
                type: boolean
            return:
              - type: table<string, umbrella.SpawnPoint[]>
                nullable: true
          - name: loadSpawnRegionsFile
            parameters:
              - name: filename
                type: string
              - name: server
                type: boolean
                nullable: true
            return:
              - type: umbrella.SpawnRegion[]
                nullable: true
          - name: loadSpawnRegions
            parameters:
              - name: regions
                type: umbrella.FileSpawnRegion[]
            return:
              - type: umbrella.SpawnRegion[]
          - name: getSpawnRegionsAux
            return:
              - type: umbrella.SpawnRegion[]
                nullable: true
          - name: getSpawnRegions
            return:
              - type: umbrella.SpawnRegion[]
                nullable: true
