version: "1.1"
languages:
  lua:
    classes:
      forageServer:
        staticFields:
          pools: {}
          byId: {}
          lastFind: {}
          focus: {}
          lastReqMs: {}
          minReqMs:
            defaultValue: "250"
          maxPickupDistance:
            defaultValue: "30"
          maxXPDistance:
            defaultValue: "20"
          nearMargin:
            defaultValue: "25"
          poolGraceMs:
            defaultValue: "60000"
          relevanceMs:
            defaultValue: "2000"
          _nextRelevanceMs:
            defaultValue: "0"
          affinityRadius:
            defaultValue: "8"
          affinityRolled: {}
          affinityChunks: {}
        staticMethods:
          - name: updateData
          - name: clearData
          - name: addZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: removeZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: updateZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: syncForageData
          - name: updateIcon
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
              - name: _iconID
                type: string
              - name: _icon
                type: umbrella.Foraging.ZoneIconData
                nullable: true
          - name: OnClientCommand
            parameters:
              - name: _module
                type: string
              - name: _command
                type: string
              - name: _plObj
                type: IsoPlayer
              - name: _packet
                type: table
                nullable: true
              - name: _clientID
                type: unknown
                nullable: true
          - name: generatePool
            parameters:
              - name: _player
              - name: _zoneData
              - name: _focus
            return:
              - type: table
          - name: ensurePool
            parameters:
              - name: _player
              - name: _zoneData
              - name: _focus
            return:
              - type: table
                nullable: true
              - type: boolean
                nullable: true
          - name: scanAffinity
            parameters:
              - name: _player
              - name: _zoneData
              - name: _entry
                type: table
                nullable: true
          - name: onRequestZone
            parameters:
              - name: _player
              - name: _focus
          - name: onSpot
            parameters:
              - name: _player
              - name: _iconID
          - name: buildItems
            parameters:
              - name: _player
              - name: _rec
              - name: _itemDef
            return:
              - type: unknown
          - name: onPickup
            parameters:
              - name: _player
              - name: _iconID
              - name: _container
            return:
              - type: boolean
          - name: dropZonePool
            parameters:
              - name: _user
              - name: _zoneId
          - name: dropPlayer
            parameters:
              - name: _user
          - name: playerNearZone
            parameters:
              - name: _px
              - name: _py
              - name: _zoneId
            return:
              - type: boolean
          - name: relevanceTick
    fields:
      forageClient:
        type: forageServer
