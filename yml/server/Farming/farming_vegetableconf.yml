version: "1.1"
languages:
  lua:
    classes:
      farming_vegetableconf:
        staticFields:
          props: {}
          sprite: {}
          unhealthySprite: {}
          dyingSprite: {}
          deadSprite: {}
          trampledSprite: {}
        staticMethods:
          - name: calcWater
            parameters:
              - name: waterMin
                type: number
              - name: waterLvl
                type: number
            return:
              - type: number
          - name: calcDisease
            parameters:
              - name: diseaseLvl
                type: number
            return:
              - type: number
          - name: getObjectPhase
            parameters:
              - name: plant
                type: SPlantGlobalObject
            return:
              - type: string
          - name: getObjectName
            parameters:
              - name: plant
                type: SPlantGlobalObject
            return:
              - type: string
          - name: getSpriteName
            parameters:
              - name: plant
                type: SPlantGlobalObject
            return:
              - type: string
                nullable: true
          - name: grow
            parameters:
              - name: planting
                type: SPlantGlobalObject
              - name: nextGrowing
                type: number
                nullable: true
              - name: updateNbOfGrow
                type: boolean
            return:
              - type: SPlantGlobalObject
    functions:
      - name: getNbOfSeed
        parameters:
          - name: nbOfSeed
            type: number
          - name: typeOfPlant
            type: string
          - name: container
            type: ItemContainer
        return:
          - type: number
      - name: getVegetablesNumber
        parameters:
          - name: min
            type: number
          - name: max
            type: number
          - name: minAutorized
            type: number
          - name: maxAutorized
            type: number
          - name: plant
            type: SPlantGlobalObject
          - name: skill
            type: number
            nullable: true
        return:
          - type: number
      - name: randomGrowthOffset
        return:
          - type: number
      - name: calcNextGrowing
        parameters:
          - name: nextGrowing
            type: number
            nullable: true
          - name: nextTime
            type: number
        return:
          - type: number
      - name: calcNextTimeFactor
        return:
          - type: number
      - name: growNext
        parameters:
          - name: planting
            type: SPlantGlobalObject
          - name: nameOfTile
            type: string
          - name: nextGrowing
            type: number
            nullable: true
          - name: howManyTime
            type: number
        return:
          - type: SPlantGlobalObject
      - name: badPlant
        parameters:
          - name: water
            type: number
          - name: waterMax
            type: number
          - name: diseaseLvl
            type: number
          - name: plant
            type: SPlantGlobalObject
          - name: nextGrowing
            type: number
            nullable: true
          - name: updateNbOfGrow
            type: boolean
      - name: doesSeasonRecipeExist
        parameters:
          - name: recipeName
            type: string
        return:
          - type: boolean
      - name: getSeasonRecipeIcon
        parameters:
          - name: recipeName
            type: string
        return:
          - type: Texture
            nullable: true
