version: "1.1"
languages:
  lua:
    classes:
      ISTradingUIHistorical:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: list
                type: umbrella.ISTradingUI.HistoryMessage[]
              - name: otherPlayer
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"ISTradingUIHistorical"'
        fields:
          list:
            type: ISScrollingListBox
          no:
            type: ISButton
          msgList:
            type: umbrella.ISTradingUI.HistoryMessage[]
          otherPlayer:
            type: IsoPlayer
        methods:
          - name: initialise
          - name: populateList
            parameters:
              - name: list
                type: umbrella.ISTradingUI.HistoryMessage[]
          - name: drawList
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: render
          - name: prerender
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: close
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirUp
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirDown
            parameters:
              - name: joypadData
                type: JoypadData
