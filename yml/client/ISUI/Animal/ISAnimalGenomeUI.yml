version: "1.1"
languages:
  lua:
    classes:
      ISAnimalGenomeUI:
        extends: ISCollapsableWindow
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: animal
                type: IsoAnimal
              - name: player
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"ISAnimalGenomeUI"'
        fields:
          mainPanel:
            type: ISPanel
          allGenes:
            type: umbrella.ISAnimalGenomeUI.GeneData[]
          title:
            type: string
          animal:
            type: IsoAnimal
          chr:
            type: IsoPlayer
          playerNum:
            type: integer
          animalName:
            type: string
          genomeList:
            type: ArrayList<AnimalGene>
        methods:
          - name: prerender
          - name: render
          - name: initialise
          - name: close
          - name: subPanelPreRender
          - name: subPanelRender
          - name: create
          - name: changeValue
            parameters:
              - name: button
                type: ISButton
          - name: onAddGb
            parameters:
              - name: button
                type: ISButton
              - name: gd
                type: string
              - name: allele
                type: AnimalAllele
          - name: onChangeDominant
            parameters:
              - name: modal
                type: ISModalDialog
              - name: allele
                type: AnimalAllele
          - name: reinit
          - name: onChangeValue
            parameters:
              - name: button
                type: ISButton
              - name: allele
                type: AnimalAllele
