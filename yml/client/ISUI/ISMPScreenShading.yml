version: "1.1"
languages:
  lua:
    classes:
      ISMPScreenShading:
        extends: ISPanel
        constructors:
          - parameters:
              - name: ui
                type: ISUIElement
        staticFields:
          Type:
            defaultValue: '"ISMPScreenShading"'
        fields:
          width:
            type: number
          height:
            type: number
          ui:
            type: ISUIElement
        methods:
          - name: initialise
          - name: destroy
          - name: onMouseDown
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: render
          - name: onResolutionChange
            parameters:
              - name: oldw
                type: number
              - name: oldh
                type: number
              - name: neww
                type: number
              - name: newh
                type: number
