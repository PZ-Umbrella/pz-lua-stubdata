version: "1.1"
languages:
  lua:
    classes:
      ISCraftingUI:
        extends: ISCollapsableWindow
        staticMethods:
          - name: ReturnItemsToOriginalContainer
            parameters:
              - name: playerObj
                type: IsoPlayer
              - name: items
                type: InventoryItem[]
          - name: ReturnItemToOriginalContainer
            parameters:
              - name: playerObj
                type: IsoPlayer
              - name: item
                type: InventoryItem
                nullable: true
          - name: ReturnItemToContainer
            parameters:
              - name: playerObj
                type: IsoPlayer
              - name: item
                type: InventoryItem
                nullable: true
              - name: cont
                type: ItemContainer
                nullable: true
