version: "1.1"
languages:
  lua:
    classes:
      JoypadState:
        staticFields:
          controllers:
            type: table<integer, JoypadControllerData>
          players:
            type: table<integer, JoypadData>
          joypads:
            type: table<integer, JoypadData>
          forceActivate:
            type: integer
            nullable: true
          dbgDrawUINavigation:
            defaultValue: "false"
          dbgDrawUI:
            defaultValue: "false"
          saveFocus:
            type: table<integer, ISUIElement>
            nullable: true
          debugUI:
            type: ISJoypadDebugUI
            nullable: true
        staticMethods:
          - name: onGamepadConnect
            parameters:
              - name: id
                type: integer
          - name: onGamepadDisconnect
            parameters:
              - name: id
                type: integer
          - name: useKeyboardMouse
          - name: getMainMenuJoypad
            return:
              - type: JoypadData
                nullable: true
          - name: saveAllFocus
          - name: restoreAllFocus
          - name: onPlayerDeath
            parameters:
              - name: playerObj
                type: IsoPlayer
          - name: onCoopJoinFailed
            parameters:
              - name: playerNum
                type: integer
          - name: onGameStart
          - name: onJoypadDebugRenderUIOptionSet
            parameters:
              - name: isActive
                type: boolean
              - name: dbgDrawUINavigation
                type: boolean
                nullable: true
          - name: onRenderUI
          - name: getDebugUI
            parameters:
              - name: autoCreate
                type: boolean
                nullable: true
            return:
              - type: ISJoypadDebugUI
                nullable: true
      Joypad:
        staticFields:
          AButton:
            defaultValue: JoypadButton.A
          BButton:
            defaultValue: JoypadButton.B
          XButton:
            defaultValue: JoypadButton.X
          YButton:
            defaultValue: JoypadButton.Y
          LBumper:
            defaultValue: JoypadButton.LeftBump
          RBumper:
            defaultValue: JoypadButton.RightBump
          Back:
            defaultValue: JoypadButton.Back
          Start:
            defaultValue: JoypadButton.Start
          LStickButton:
            defaultValue: JoypadButton.LeftStick
          RStickButton:
            defaultValue: JoypadButton.RightStick
          Other:
            defaultValue: JoypadButton.Guide
          DPadLeft:
            defaultValue: JoypadButton.DPadLeft
          DPadRight:
            defaultValue: JoypadButton.DPadRight
          DPadUp:
            defaultValue: JoypadButton.DPadUp
          DPadDown:
            defaultValue: JoypadButton.DPadDown
          ButtonTextures: {}
          AxisTextures: {}
          Texture:
            type: Joypad.Texture
        staticMethods:
          - name: initControllerButtonStyle
            parameters:
              - name: optionStr
                type: string
          - name: optionControllerButtonStyleChanged
            parameters:
              - name: newOption
                type: string
      Joypad.Texture:
        local: true
        staticFields:
          AButton:
            defaultValue: Joypad.ButtonTextures[JoypadButton.A]
          BButton:
            defaultValue: Joypad.ButtonTextures[JoypadButton.B]
          XButton:
            defaultValue: Joypad.ButtonTextures[JoypadButton.X]
          YButton:
            defaultValue: Joypad.ButtonTextures[JoypadButton.Y]
          LBumper:
            defaultValue: Joypad.ButtonTextures[JoypadButton.LeftBump]
          RBumper:
            defaultValue: Joypad.ButtonTextures[JoypadButton.RightBump]
          Start:
            defaultValue: Joypad.ButtonTextures[JoypadButton.Start]
          Back:
            defaultValue: Joypad.ButtonTextures[JoypadButton.Back]
          Menu:
            defaultValue: Joypad.ButtonTextures[JoypadButton.Start]
          View:
            defaultValue: Joypad.ButtonTextures[JoypadButton.Back]
          LStick:
            defaultValue: Joypad.AxisTextures[JoypadAxis2d.LeftStick]
          LStickLR:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.LeftStickX]
          LStickUD:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.LeftStickY]
          RStick:
            defaultValue: Joypad.AxisTextures[JoypadAxis2d.RightStick]
          RStickLR:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.RightStickX]
          RStickUD:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.RightStickY]
          DPad:
            defaultValue: JoypadIconTextureGetter:new("DPad")
          DPadUp:
            defaultValue: Joypad.ButtonTextures[JoypadButton.DPadUp]
          DPadRight:
            defaultValue: Joypad.ButtonTextures[JoypadButton.DPadRight]
          DPadDown:
            defaultValue: Joypad.ButtonTextures[JoypadButton.DPadDown]
          DPadLeft:
            defaultValue: Joypad.ButtonTextures[JoypadButton.DPadLeft]
          LTrigger:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.LeftTrigger]
          RTrigger:
            defaultValue: Joypad.AxisTextures[JoypadAxis1d.RightTrigger]
        staticMethods:
          - name: fromCommand
            parameters:
              - name: command
                type: string
            return:
              - type: JoypadIconTextureGetter
                nullable: true
      joypad:
        staticFields:
          wantNoise:
            defaultValue: getDebug()
      JoypadControllerData:
        extends: ISBaseObject
        constructors:
          - parameters:
              - name: id
                type: integer
        staticFields:
          Type:
            defaultValue: '"JoypadControllerData"'
        fields:
          joypad:
            type: JoypadData
            nullable: true
          id:
            type: integer
          pressed:
            type: table<integer, boolean>
          wasPressed:
            type: table<integer, boolean>
          connected:
            type: boolean
          timedown:
            type: number
          down:
            type: boolean
          timedownproc:
            type: number
          dtdown:
            type: number
          dtprocdown:
            type: number
          timeup:
            type: number
          up:
            type: boolean
          timeupproc:
            type: number
          dtup:
            type: number
          dtprocup:
            type: number
          timeleft:
            type: number
          left:
            type: boolean
          timeleftproc:
            type: number
          dtleft:
            type: number
          dtprocleft:
            type: number
          timeright:
            type: number
          right:
            type: boolean
          timerightproc:
            type: number
          dtright:
            type: number
          dtprocright:
            type: number
          pressedTime:
            type: table<integer, number>
        methods:
          - name: setJoypad
            parameters:
              - name: joypadData
                type: JoypadData
          - name: clearJoypad
          - name: onPauseButtonPressed
          - name: onPressButtonNoFocus
            parameters:
              - name: button
                type: JoypadButton
          - name: onPressButton
            parameters:
              - name: button
                type: JoypadButton
          - name: onHoldButton
            parameters:
              - name: button
                type: JoypadButton
              - name: time
                type: number
          - name: onReleaseButton
            parameters:
              - name: button
                type: JoypadButton
          - name: onPressUp
          - name: onReleaseUp
          - name: onPressDown
          - name: onReleaseDown
          - name: onPressLeft
          - name: onReleaseLeft
          - name: onPressRight
          - name: onReleaseRight
          - name: update
            parameters:
              - name: time
                type: number
      JoypadData:
        extends: ISBaseObject
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"JoypadData"'
        fields:
          id:
            type: integer
          controller:
            type: JoypadControllerData
            nullable: true
          isActive:
            type: boolean
          isDoingNavigation:
            type: boolean
          currentNavigateUI:
            type: ISUIElement
            nullable: true
          player:
            type: integer
            nullable: true
          focus:
            type: ISUIElement
            nullable: true
          lastfocus:
            type: ISUIElement
            nullable: true
          prevfocus:
            type: ISUIElement
            nullable: true
          prevprevfocus:
            type: ISUIElement
            nullable: true
          inMainMenu:
            type: boolean
          listBox:
            type: ISJoypadListBox
            nullable: true
        methods:
          - name: setController
            parameters:
              - name: controller
                type: JoypadControllerData
          - name: clearController
          - name: isConnected
            return:
              - type: boolean
                nullable: true
          - name: setActive
            parameters:
              - name: isActive
                type: boolean
          - name: isFocusOnElementOrDescendant
            parameters:
              - name: ui
                type: ISUIElement
            return:
              - type: boolean
          - name: startNavigation
          - name: endNavigation
    functions:
      - name: getFocusForPlayer
        parameters:
          - name: playerNum
            type: integer
        return:
          - type: ISUIElement
            nullable: true
      - name: isJoypadFocusOnElementOrDescendant
        parameters:
          - name: playerNum
            type: integer
          - name: ui
            type: ISUIElement
        return:
          - type: boolean
            nullable: true
      - name: getJoypadData
        parameters:
          - name: playerID
            type: integer
        return:
          - type: JoypadData
      - name: getJoypadFocus
        parameters:
          - name: playerID
            type: integer
        return:
          - type: ISUIElement
            nullable: true
      - name: setJoypadFocus
        parameters:
          - name: playerID
            type: integer
          - name: control
            type: ISUIElement
            nullable: true
      - name: setPrevFocusForPlayer
        parameters:
          - name: playerID
            type: integer
      - name: setPrevPrevFocusForPlayer
        parameters:
          - name: playerID
            type: integer
      - name: isIgnoreAim
        parameters:
          - name: uiElement
            type: ISUIElement
        return:
          - type: boolean
      - name: isIgnoreButtons
        parameters:
          - name: uiElement
            type: ISUIElement
        return:
          - type: boolean
      - name: updateJoypadFocus
        parameters:
          - name: joypadData
            type: JoypadData
            nullable: true
      - name: onJoypadRenderTick
        parameters:
          - name: ticks
            nullable: true
      - name: onJoypadActivate
        parameters:
          - name: id
            type: integer
      - name: onJoypadActivateNotifyPlayer
        parameters:
          - name: joypadData
            type: JoypadData
      - name: onJoypadActivateUI
        parameters:
          - name: id
            type: integer
      - name: onJoypadBeforeDeactivate
        parameters:
          - name: id
            type: integer
      - name: onJoypadDeactivate
        parameters:
          - name: id
            type: integer
      - name: onJoypadBeforeReactivate
        parameters:
          - name: id
            type: integer
      - name: onJoypadReactivate
        parameters:
          - name: id
            type: integer
