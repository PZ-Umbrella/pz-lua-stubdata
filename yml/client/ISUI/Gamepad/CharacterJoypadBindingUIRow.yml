version: "1.1"
languages:
  lua:
    classes:
      CharacterJoypadBindingUIRow:
        extends: ISPanel
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: uiBinding
                type: CharacterJoypadBindingUIEntry
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
        staticFields:
          Type:
            defaultValue: '"CharacterJoypadBindingUIRow"'
        fields:
          SuperType:
            type: ISPanel
          uiBinding:
            type: CharacterJoypadBindingUIEntry
          bindingKey:
            type: umbrella.PhysicalJoypadElement
          name:
            type: string
          isEditSelected:
            type: boolean
          selectButton:
            type: ISButton
          spinBoxOptionsZeroToOne:
            type: string[]
          bindingLabel:
            type: ISLabel
          entries:
            type: table[]
          borderSpacing:
            type: number
          indentWidth:
            type: number
        methods:
          - name: populate
          - name: rePopulate
          - name: populateWithEditableElements
          - name: onJoypadButtonBindingChanged
            parameters:
              - name: senderBox
                type: ISComboBox
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
              - name: charBinding
                type: CharacterJoypadButtonBinding
          - name: onAddNewJoypadBindingChanged
            parameters:
              - name: senderBox
                type: ISComboBox
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
          - name: onJoypadButtonAxis1dBindingChanged
            parameters:
              - name: senderBox
                type: ISComboBox
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
              - name: charBinding
                type: CharacterJoypadButtonBinding
          - name: onJoypadButtonAxis2dBindingChanged
            parameters:
              - name: senderBox
                type: ISComboBox
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
              - name: charBinding
                type: CharacterJoypadButtonBinding
          - name: onJoypadAxisMinThresholdEdited
            parameters:
              - name: sender
                type: ISSpinBox
          - name: populateWithReadOnlyLabels
          - name: onDoLayout
          - name: setEditSelected
            parameters:
              - name: isSelected
                type: boolean
          - name: onSelectButtonClicked
          - name: createJoypadButtonBindingCBox
            parameters:
              - name: bindingKey
                type: umbrella.PhysicalJoypadElement
              - name: selectedCharBinding
                type: CharacterJoypadButtonBinding | string
              - name: excludingCharBindings
                type: CharacterJoypadButtonBinding[]
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
            return:
              - type: ISComboBox
