              - name: r
                type: number
              - name: g
                type: number
              - name: b
                type: number
              - name: a
                type: number
          - name: setBorderRGBA
            parameters:
              - name: r
                type: number
              - name: g
                type: number
              - name: b
                type: number
              - name: a
                type: number
          - name: setTextureRGBA
            parameters:
              - name: r
                type: number
              - name: g
                type: number
              - name: b
                type: number
              - name: a
                type: number
          - name: enableAcceptColor
          - name: enableCancelColor
          - name: toggleAcceptCancel
            parameters:
              - name: bEnabled
                type: boolean
          - name: setEnable
            parameters:
              - name: bEnabled
                type: boolean
          - name: isEnabled
            return:
              - type: boolean
          - name: setTooltip
