                type: umbrella.ISMPButton.OnClick
              - name: arg1
                type: unknown
                nullable: true
              - name: arg2
                type: unknown
                nullable: true
              - name: arg3
                type: unknown
                nullable: true
              - name: arg4
                type: unknown
                nullable: true
