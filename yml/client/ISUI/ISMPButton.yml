            nullable: true
          enable:
            type: boolean
          borderColorEnabled:
            type: umbrella.RGBA
          backgroundColorEnabled:
            type: umbrella.RGBA
          tooltip:
            nullable: true
          originalWidth:
            type: number
          onclick:
            type: umbrella.ISMPButton.OnClick
            nullable: true
          onClickArgs:
