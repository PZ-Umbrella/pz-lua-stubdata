version: "1.1"
languages:
  lua:
    classes:
      ISInventoryWindowControlHandler_TransferSameType:
        extends: ISInventoryWindowControlHandler
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"ISInventoryWindowControlHandler_TransferSameType"'
        fields:
          control:
            type: ISUIElement
            nullable: true
          isMouseOver:
            type: boolean
          itemsToTransferMap:
            type: table<InventoryItem, boolean>
          inventoryContainerCount:
            type: number
          lootContainerCount:
            type: number
        methods:
          - name: shouldBeVisible
            return:
              - type: boolean
          - name: getControl
            return:
              - type: ISUIElement
          - name: perform
          - name: getItemsTable
            parameters:
              - name: container
                type: ItemContainer
            return:
              - type: table<string, InventoryItem[]>
          - name: getItemsToTransfer
            return:
              - type: InventoryItem[]
              - type: table<InventoryItem, boolean>
          - name: onMouseOverButton
            parameters:
              - name: button
                type: ISButton
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseOutButton
            parameters:
              - name: button
                type: ISButton
              - name: dx
                type: number
              - name: dy
                type: number
          - name: wasInventoryUpdated
            return:
              - type: boolean
          - name: wasLootUpdated
            return:
              - type: boolean
