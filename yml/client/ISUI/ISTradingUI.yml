version: "1.1"
languages:
  lua:
    classes:
      ISTradingUI:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: player
                type: IsoPlayer
              - name: otherPlayer
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"ISTradingUI"'
          windows: {}
          CoolDownMessage:
            defaultValue: "300"
          States: {}
          MaxItems:
            defaultValue: "20"
          tradeQuestionUI:
            type: ISModalDialog
            nullable: true
        fields:
          infoBtn:
            type: ISButton
          inventoryList:
            type: ISTradingUI.InventoryList
          addBtn:
            type: ISButton
          yourOfferDatas:
            type: ISScrollingListBox
          remove:
            type: ISButton
          hisOfferDatas:
            type: ISScrollingListBox
          sealOffer:
            type: ISTickBox
          no:
            type: ISButton
          historic:
            type: ISButton
          acceptDeal:
            type: ISButton
          otherSealedOffer:
            type: boolean
          blockingMessage:
            type: string
            nullable: true
          blockingMessage2:
            type: string
            nullable: true
          toolRender:
            type: ISToolTipInv
          historyMessageCD:
            type: number
          historicalUI:
            type: ISTradingUIHistorical
          infoRichText:
            type: ISModalRichText
          joypadButtonsSealed:
            type: boolean
          joypadButtonsBlocked:
            type: boolean
          listHeaderColor:
            type: umbrella.RGBA
          player:
            type: IsoPlayer
          otherPlayer:
            type: IsoPlayer
          yourOffer:
            nullable: true
          hisOffer:
            nullable: true
          selectedItem:
            type: umbrella.ISScrollingListBox.Item
            nullable: true
          pendingRequest:
            type: boolean
          historyMessage:
            type: string
            nullable: true
          historical:
            type: umbrella.ISTradingUI.HistoryMessage[]
          prevFocus: {}
        methods:
          - name: initialise
          - name: onSealOffer
            parameters:
              - name: clickedOption
                type: integer
              - name: enabled
                type: boolean
          - name: isOfferSealed
            return:
              - type: boolean
          - name: addItemToYourOffer
            parameters:
              - name: item
                type: InventoryItem
          - name: isItemOffered
            parameters:
              - name: item
            return:
              - type: boolean
          - name: update
          - name: removeItem
            parameters:
              - name: item
                type: umbrella.ISScrollingListBox.Item
          - name: onInvokeListItem_Inventory
            parameters:
              - name: data
          - name: onInvokeListItem_YourOffer
            parameters:
              - name: data
          - name: drawOffer
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: prerender
          - name: getTooltipItem
            return:
              - type: unknown
                nullable: true
          - name: updateTooltip
          - name: updateButtons
          - name: render
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: showInfoWindow
          - name: addSelectedInventoryItem
          - name: close
          - name: finalizeDeal
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown
            parameters:
              - name: button
                type: integer
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown_Descendant
            parameters:
              - name: descendant
              - name: button
                type: integer
              - name: joypadData
                type: JoypadData
          - name: isInputBlocked
            return:
              - type: boolean
          - name: initJoypadButtons
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onAnswerTradeRequest
            parameters:
              - name: button
                type: ISButton
          - name: getIndexFromItemId
            parameters:
              - name: itemId
                type: integer
            return:
              - type: integer
          - name: setHistoryMessage
            parameters:
              - name: message
                type: string
              - name: publishInHistorical
                type: boolean
              - name: add
                type: boolean
              - name: remove
                type: boolean
        staticMethods:
          - name: GetUIForPlayer
            parameters:
              - name: playerObj
                type: IsoPlayer
            return:
              - type: unknown
                nullable: true
          - name: ReceiveTradeRequest
            parameters:
              - name: otherPlayer
              - name: player
          - name: AcceptedTrade
            parameters:
              - name: otherPlayer
              - name: player
              - name: accepted
                type: boolean
          - name: OtherAddNewItem
            parameters:
              - name: otherPlayer
              - name: player
                type: IsoPlayer
              - name: item
                type: InventoryItem
          - name: RemoveItem
            parameters:
              - name: otherPlayer
              - name: player
                type: IsoPlayer
              - name: itemId
                type: integer
          - name: UpdateState
            parameters:
              - name: otherPlayer
              - name: player
                type: IsoPlayer
              - name: state
                type: integer
      ISTradingUI.InventoryList:
        extends: ISScrollingListBox
        local: true
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: tradingUI
                type: ISTradingUI
        staticFields:
          Type:
            defaultValue: '"ISTradingUI_InventoryList"'
        fields:
          selected: {}
          inventoryContainerCount:
            type: number
          itemTables:
            type: table
          itemTableList:
            type: table
          tradingUI:
            type: ISTradingUI
          treeExpIcon: {}
          treeColIcon: {}
          collapsed:
            type: table
          joypadParent:
            type: ISTradingUI
          joyfocus: {}
        methods:
          - name: onMouseUp
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: expandCollapseSize
            return:
              - type: unknown
          - name: iconSize
            return:
              - type: number
          - name: doDrawItem
            parameters:
              - name: y
              - name: item
              - name: alt
            return:
              - type: number
          - name: updateYourInventory
          - name: updateLater
          - name: wasInventoryUpdated
            return:
              - type: boolean
          - name: groupInventoryItemsByName
          - name: getEquippedAndHotbarItems
            parameters:
              - name: isEquipped
                type: boolean
              - name: isInHotbar
                type: boolean
          - name: addInventoryItemToGroup
            parameters:
              - name: item
              - name: isEquipped
                type: boolean
              - name: isInHotbar
                type: boolean
          - name: onJoypadDirRight
            parameters:
              - name: joypadData
                type: JoypadData
        staticMethods:
          - name: itemSortByNameInc
            parameters:
              - name: a
              - name: b
            return:
              - type: boolean
      umbrella.ISTradingUI.HistoryMessage:
        fields:
          message:
            type: string
          add:
            type: boolean
            nullable: true
          remove:
            type: boolean
            nullable: true
