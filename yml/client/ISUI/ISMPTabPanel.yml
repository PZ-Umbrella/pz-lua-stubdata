version: "1.1"
languages:
  lua:
    aliases:
      umbrella.ISMPTabPanel.TabTornOff:
        - type: "fun(target: unknown, tornOff: umbrella.ISMPTabPanel.View, newWindow:
            ISCollapsableWindow)"
    classes:
      ISMPTabPanel:
        extends: ISPanel
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"ISMPTabPanel"'
          xMouse:
            defaultValue: "-1"
          yMouse:
            defaultValue: "-1"
          mouseOut:
            defaultValue: "false"
          viewDragging:
            type: umbrella.ISMPTabPanel.View
            nullable: true
          viewDraggin:
            type: table
            nullable: true
          fromOutside:
            type: boolean
            nullable: true
        fields:
          scrollX:
            type: number
            nullable: true
          smoothScrollTargetX:
            type: number
            nullable: true
          smoothScrollX:
            type: number
            nullable: true
          tabTransparency:
            type: number
          textTransparency:
            type: number
          isDragging:
            type: boolean
          blinkTabAlpha:
            type: number
          blinkTabAlphaIncrease:
            type: boolean
          draggingTab:
            type: number
            nullable: true
          viewList:
            type: table
          activeView:
            type: table
            nullable: true
          maxLength:
            type: number
          equalTabWidth:
            type: boolean
          centerTabs:
            type: boolean
          tabTornOffTarget:
            type: unknown
            nullable: true
          tabTornOff:
            type: umbrella.ISMPTabPanel.TabTornOff
            nullable: true
          backgroundColorPanel:
            type: umbrella.RGBA
          backgroundColorSelected:
            type: umbrella.RGBA
          blinkTabs:
            type: table
          tabHeight:
            type: number
          tabPadX:
            type: number
          allowDraggingTabs:
            type: boolean
          allowTornOffTabs:
            type: boolean
        methods:
          - name: initialise
          - name: updateSmoothScrolling
          - name: ensureVisible
            parameters:
              - name: index
                type: integer
          - name: setTabsTransparency
            parameters:
              - name: alpha
                type: number
          - name: setTextTransparency
            parameters:
              - name: alpha
                type: number
          - name: prerender2
          - name: prerender
          - name: onMouseDown
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseMoveOutside
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseMove
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseUpOutside
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseUp
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseWheel
            parameters:
              - name: del
                type: number
            return:
              - type: boolean
          - name: getView
            parameters:
              - name: viewName
                type: string
            return:
              - type: ISUIElement
                nullable: true
          - name: setWidth
            parameters:
              - name: w
                type: number
          - name: setHeight
            parameters:
              - name: h
                type: number
          - name: activateView
            parameters:
              - name: viewName
                type: string
            return:
              - type: boolean
          - name: getActiveView
            return:
              - type: ISUIElement
                nullable: true
          - name: getActiveViewIndex
            return:
              - type: integer
                nullable: true
          - name: addView
            parameters:
              - name: name
                type: string
              - name: iconEnabled
                type: Texture
              - name: iconDisabled
                type: Texture
              - name: view
                type: ISUIElement
          - name: removeView
            parameters:
              - name: view
                type: ISUIElement
          - name: replaceView
            parameters:
              - name: view
                type: ISUIElement
              - name: panel
                type: ISUIElement
            return:
              - type: ISUIElement
                nullable: true
          - name: setEqualTabWidth
            parameters:
              - name: equal
                type: boolean
          - name: setCenterTabs
            parameters:
              - name: center
                type: boolean
          - name: getWidthOfAllTabs
            return:
              - type: number
          - name: getTabX
            parameters:
              - name: tabIndex
                type: integer
              - name: scrollX
                type: number
            return:
              - type: number
          - name: getTabIndexAtX
            parameters:
              - name: x
                type: number
              - name: scrollX
                type: number
            return:
              - type: number
          - name: getScrollButtonAtX
            parameters:
              - name: x
                type: number
            return:
              - type: string
                nullable: true
          - name: setOnTabTornOff
            parameters:
              - name: target
                type: unknown
                nullable: true
              - name: method
                type: umbrella.ISMPTabPanel.TabTornOff
        staticMethods:
          - name: redoTab
            parameters:
              - name: self
                type: ISMPTabPanel
      umbrella.ISMPTabPanel.View:
        extends: umbrella.ISTabPanel.View
        fields:
          iconEnabled:
            type: Texture
          iconDisabled:
            type: Texture
