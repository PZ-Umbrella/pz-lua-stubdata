version: "1.1"
languages:
  lua:
    classes:
      ISMapSymbolZoomPanel:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"ISMapSymbolZoomPanel"'
        fields:
          minZoomBox:
            type: ISSpinBox
          maxZoomBox:
            type: ISSpinBox
        methods:
          - name: createChildren
          - name: initSpinBox
            parameters:
              - name: spinBox
                type: ISSpinBox
          - name: onChangeMinZoom
          - name: onChangeMaxZoom
          - name: setMinMaxZoom
            parameters:
              - name: minZoomF
                type: number
              - name: maxZoomF
                type: number
          - name: findClosestZoom
            parameters:
              - name: spinBox
                type: ISSpinBox
              - name: zoomF
                type: number
            return:
              - type: number
          - name: getZoom
            parameters:
              - name: spinBox
            return:
              - type: number
                nullable: true
