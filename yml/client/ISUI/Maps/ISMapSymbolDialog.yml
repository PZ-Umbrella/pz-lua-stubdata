version: "1.1"
languages:
  lua:
    classes:
      ISMapSymbolDialog:
        extends: ISCollapsableWindowJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: title
                type: string
              - name: target
                type: umbrella.ISTextBoxMap.Target
              - name: onclick
                type: umbrella.ISButton.OnClick
                nullable: true
              - name: player
                type: integer
                nullable: true
              - name: param1
                type: unknown
                nullable: true
              - name: param2
                type: unknown
                nullable: true
              - name: param3
                type: unknown
                nullable: true
              - name: param4
                type: unknown
                nullable: true
        staticFields:
          Type:
            defaultValue: '"ISMapSymbolDialog"'
        fields:
          colorButtonInfo:
            type: umbrella.ISTextBoxMap.ColorButtonInfo[]
          colorButtons:
            type: ISButton[]
          blackColor:
            type: ColorInfo
          currentColor:
            type: ColorInfo
          tickBoxPerspective:
            type: ISTickBox
          sliderScale:
            type: ISSliderPanel
          sliderRotation:
            type: ISSliderPanel
          zoomPanel:
            type: ISMapSymbolZoomPanel
          yes:
            type: ISButton
          no:
            type: ISButton
          scale:
            type: number
          rotation:
            type: number
            nullable: true
          character:
            nullable: true
          text:
            type: string
          mapUI:
            type: umbrella.MapUI
          symbolsUI:
            type: ISWorldMapSymbols
          onclick:
            type: umbrella.ISButton.OnClick
            nullable: true
          player:
            type: integer
            nullable: true
          param1:
            nullable: true
          param2:
            nullable: true
          param3:
            nullable: true
          param4:
            nullable: true
        methods:
          - name: createChildren
          - name: destroy
          - name: onScaleChange
            parameters:
              - name: value
                type: number
              - name: slider
                type: ISSliderPanel
          - name: onRotationChange
            parameters:
              - name: value
                type: number
              - name: slider
                type: ISSliderPanel
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: prerender
          - name: updateButtons
          - name: selectColor
            parameters:
              - name: r
                type: number
              - name: g
                type: number
              - name: b
                type: number
          - name: showMatchPerspectiveTickBox
            parameters:
              - name: matchPerspective
                type: boolean
          - name: showScaleSlider
            parameters:
              - name: scale
                type: number
          - name: showRotationSlider
            parameters:
              - name: degrees
                type: number
          - name: showZoomPanel
            parameters:
              - name: minZoomF
                type: number
              - name: maxZoomF
                type: number
          - name: layoutWidgets
          - name: isMatchPerspective
            return:
              - type: boolean
          - name: render
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown
            parameters:
              - name: button
                type: JoypadButton
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirDown
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirUp
            parameters:
              - name: joypadData
                type: JoypadData
          - name: close
