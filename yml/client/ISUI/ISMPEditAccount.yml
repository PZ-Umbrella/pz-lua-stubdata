version: "1.1"
languages:
  lua:
    classes:
      ISMPEditAccount:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: ui
                type: ISUIElement
              - name: server
                type: Server
              - name: account
                type: Account
                nullable: true
        staticFields:
          Type:
            defaultValue: '"ISMPEditAccount"'
          instance:
            type: ISMPEditAccount
            nullable: true
        fields:
          login:
            type: ISTextEntryBox
          authType:
            type: ISComboBox
          password:
            type: ISTextEntryBox
          seePasswordBtn:
            type: ISButton
          rememberPasswordTickBox:
            type: ISTickBox
          addBelow:
            type: ISTickBox
          steamRelayTickBox:
            type: ISTickBox
          googleAuthPopup:
            type: ISPanel
          googleAuthLabel:
            type: ISLabel
          googleAuthButton:
            type: ISButton
          googleKey:
            type: string
          cancelBtn:
            type: ISButton
          saveBtn:
            type: ISButton
          isPasswordModified:
            type: boolean
          servers_serveripmessage_lines:
            type: string[]
          servers_serveripwarning_lines:
            type: string[]
          ui_password_eye:
            type: Texture
          ui_droplist:
            type: Texture
          ui:
            type: ISUIElement
          server:
            type: Server
          account:
            type: Account
            nullable: true
          accountLoginList:
            type: table<string, boolean>
        methods:
          - name: initialise
          - name: onComboAuthType
          - name: destroy
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: onResolutionChange
            parameters:
              - name: oldw
                type: number
              - name: oldh
                type: number
              - name: neww
                type: number
              - name: newh
                type: number
          - name: prerender
          - name: render
          - name: onOtherKey
            parameters:
              - name: key
                type: integer
          - name: onCommandEntered
          - name: onMouseUp
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseUpOutside
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseDown
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseMoveOutside
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseMove
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadBeforeDeactivate
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown
            parameters:
              - name: button
                type: JoypadButton
        staticMethods:
          - name: onLoginTextChange
            parameters:
              - name: txtEntry
                type: ISTextEntryBox
          - name: OnConnectFailed
            parameters:
              - name: message
                type: string
              - name: detail
                type: string
                nullable: true
          - name: OnConnected
          - name: OnQRReceived
            parameters:
              - name: message
                type: string
