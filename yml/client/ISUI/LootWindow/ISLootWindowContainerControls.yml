version: "1.1"
languages:
  lua:
    classes:
      ISLootWindowContainerControls:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: lootWindow
                type: ISInventoryPage
        staticFields:
          Type:
            defaultValue: '"ISLootWindowContainerControls"'
        fields:
          lootWindow:
            type: ISInventoryPage
          handlers:
            type: table<ISLootWindowObjectControlHandler, ISLootWindowObjectControlHandler>
          controls:
            type: ISUIElement[]
        methods:
          - name: createChildren
          - name: checkHandler
            parameters:
              - name: handlerClass
                type: ISLootWindowObjectControlHandler
              - name: object
                type: IsoObject
                nullable: true
              - name: container
                type: ItemContainer
                nullable: true
            return:
              - type: unknown
          - name: arrange
          - name: getDisplayedContainer
            return:
              - type: ItemContainer
                nullable: true
          - name: getDisplayedObject
            return:
              - type: IsoObject
                nullable: true
          - name: handleJoypadContextMenu
            parameters:
              - name: context
                type: ISContextMenu
          - name: fixMouseOverButton
        staticMethods:
          - name: AddHandler
            parameters:
              - name: handlerClass
                type: ISLootWindowObjectControlHandler
              - name: displayToRight
                type: boolean
          - name: AddFloorHandler
            parameters:
              - name: handlerClass
                type: ISLootWindowObjectControlHandler
      ISLootWindowContainerControls_HandlerList: {}
      ISLootWindowContainerControls_HandlerSet: {}
      ISLootWindowContainerControls_FloorHandlerList: {}
      ISLootWindowContainerControls_FloorHandlerSet: {}
