version: "1.1"
languages:
  lua:
    classes:
      ISUsersList:
        extends: ISPanel
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: player
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"ISUsersList"'
          instance:
            type: ISUsersList
            nullable: true
        fields:
          add:
            type: ISButton
          bannedIPs:
            type: ISButton
          refresh:
            type: ISButton
          close:
            type: ISButton
          searchEntry:
            type: ISTextEntryBox
          sortByNameButton: {}
          sortByRoleButton: {}
          sortByLastConnectionButton: {}
          sortByWarningsButton: {}
          datas:
            type: ISScrollingListBox
          warningsColumnX:
            type: number
          lastConnectionColumnX:
            type: number
          roleColumnX:
            type: number
          showOnlineOnly:
            type: boolean
          sortDown:
            type: boolean
          sortType:
            type: string
          player:
            type: IsoPlayer
          arrowUp: {}
          arrowDown: {}
        methods:
          - name: initialise
          - name: refresh
          - name: calculateColumnPositions
          - name: createColumnHeader
            parameters:
              - name: name
                type: string
              - name: sortType
              - name: x
                type: number
              - name: width
                type: number
            return:
              - type: ISButton
          - name: populateList
          - name: drawDatas
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: onSelectUser
            parameters:
              - name: _item
                type: IsoPlayer
          - name: doSearch
          - name: toggleShowOnlineOnly
          - name: onClickSort
            parameters:
              - name: button
                type: ISButton
          - name: prerender
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: onClickOption
            parameters:
              - name: item
                type: IsoPlayer
              - name: action
                type: string
          - name: onSetRoleClickOption
            parameters:
              - name: item
                type: IsoPlayer
              - name: role
                type: string
          - name: onDeleteModalClick
            parameters:
              - name: button
                type: ISButton
          - name: onSetPasswordClick
            parameters:
              - name: button
                type: ISButton
              - name: username
                type: string
          - name: onAddUserClick
            parameters:
              - name: button
                type: ISButton
          - name: onRightMouse
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: doContextMenu
            parameters:
              - name: item
                type: IsoPlayer
              - name: x
                type: number
              - name: y
                type: number
          - name: closeModal
        staticMethods:
          - name: comparator
            parameters:
              - name: user1
              - name: user2
            return:
              - type: boolean
                nullable: true
          - name: onAddWarningPoint
            parameters:
              - name: username
                type: string
              - name: button
                type: ISButton
              - name: reason
                type: string
              - name: amount
                type: string
