version: "1.1"
languages:
  lua:
    aliases:
      umbrella.ISAdminPowerUI.SetFunction:
        - type: "fun(self: ISAdminPowerUI, selected: boolean)"
    classes:
      ISAdminPowerUI:
        extends: ISPanel
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: player
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"ISAdminPowerUI"'
          messages: {}
          OptionList: {}
          OptionById: {}
          instance:
            type: ISAdminPowerUI
            nullable: true
        fields:
          tickBoxLeft:
            type: ISTickBox
          tickBoxRight:
            type: ISTickBox
          richText:
            type: ISRichTextLayout
          ok:
            type: ISButton
          cancel:
            type: ISButton
          optionsLeft:
            type: table
          cheatTooltipsLeft:
            type: table
          optionsRight:
            type: table
          cheatTooltipsRight:
            type: table
          player:
            type: IsoPlayer
        methods:
          - name: initialise
          - name: addOptionLeft
            parameters:
              - name: option
          - name: addOptionRight
            parameters:
              - name: option
          - name: updateAdminPower
          - name: addAdminPowerOptionsLeft
          - name: addAdminPowerOptionsRight
          - name: onTicked
            parameters:
              - name: index
                type: integer
              - name: selected
                type: boolean
          - name: renderTickBox
            parameters:
              - name: tickBox
                type: ISTickBox
              - name: tooltips
                type: table
          - name: render
          - name: prerender
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: saveOptions
        staticMethods:
          - name: AddOption
            parameters:
              - name: id
                type: string
              - name: side
                type: string
              - name: capability
              - name: functionGet
                type: function
              - name: functionSet
                type: function
            return:
              - type: table
          - name: OnOpenPanel
            return:
              - type: ISAdminPowerUI
          - name: onGameStart
