version: "1.1"
languages:
  lua:
    classes:
      ISUISpriteBounds:
        extends: ISBaseObject
        constructors:
          - parameters:
              - name: texture
                type: Texture | ISUITextureGetter
              - name: textureSize
                type: "{ width: number, height: number }"
              - name: subTextureBounds
                type: umbrella.XYWH
        staticFields:
          Type:
            defaultValue: '"ISUISpriteBounds"'
        fields:
          texture:
            type: Texture | ISUITextureGetter
          textureSize:
            type: "{ width: number, height: number }"
          subTextureBounds:
            type: umbrella.XYWH
      ISUISpriteBoundsGetter:
        extends: ISBaseObject
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"ISUISpriteBoundsGetter"'
        fields:
          spriteBounds:
            type: ISUISpriteBounds
            nullable: true
        methods:
          - name: getSpriteBounds
            return:
              - type: ISUISpriteBounds
          - name: invalidate
          - name: loadSpriteBounds
        staticMethods:
          - name: checkGetSpriteBounds
            parameters:
              - name: spriteBounds
                type: ISUISpriteBoundsGetter | ISUISpriteBounds
            return:
              - type: ISUISpriteBounds
      ISUISprite:
        extends: ISUIElement
        constructors:
          - parameters:
              - name: texture
                type: Texture | ISUITextureGetter
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: textureWidth
                type: number
              - name: textureHeight
                type: number
        staticFields:
          Type:
            defaultValue: '"ISUISprite"'
        fields:
          spriteBounds:
            type: ISUISpriteBoundsGetter | ISUISpriteBounds
          color:
            type: umbrella.RGBA
        methods:
          - name: newFromBounds
            parameters:
              - name: spriteBounds
                type: ISUISpriteBoundsGetter | ISUISpriteBounds
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
            return:
              - type: ISUISprite
          - name: setSpriteBounds
            parameters:
              - name: spriteBounds
                type: ISUISpriteBoundsGetter | ISUISpriteBounds
          - name: getSpriteBounds
            return:
              - type: ISUISpriteBounds
          - name: invalidateSpriteBounds
          - name: getSpriteAspectRatio
            return:
              - type: number
          - name: setHeightToPreserveAspect
          - name: prerender
