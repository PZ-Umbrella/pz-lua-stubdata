version: "1.1"
languages:
  lua:
    classes:
      MusicChoices:
        staticFields:
          drama:
            defaultValue: "0"
          last:
            type: string
            defaultValue: '""'
          choices: {}
          ambient: {}
          remasteredchoices: {}
        staticMethods:
          - name: compareByDrama
            parameters:
              - name: a
                type: umbrella.MusicChoices.Choice
              - name: b
                type: umbrella.MusicChoices.Choice
            return:
              - type: boolean
          - name: compareByAmbientDrama
            parameters:
              - name: a
                type: umbrella.MusicChoices.AmbientChoice
              - name: b
                type: umbrella.MusicChoices.AmbientChoice
            return:
              - type: boolean
          - name: get
            parameters:
              - name: drama
                type: number
            return:
              - type: string
          - name: getAmbient
            parameters:
              - name: drama
            return:
              - type: string
