version: "1.1"
languages:
  lua:
    classes:
      SurvivalGuide:
        extends: ISCollapsableWindowJoypad
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"SurvivalGuide"'
          instance:
            type: SurvivalGuide
            nullable: true
        fields:
          listBox:
            type: ISScrollingListBox
          videoRichText:
            type: ISRichTextPanel
          descriptionRichText:
            type: ISRichTextPanel
          showGuideTickBox:
            type: ISTickBox
          closeButton:
            type: ISButton
          previousJoypadFocus:
            nullable: true
          selectedItem: {}
          smallResolution:
            type: boolean
          mediumResolution:
            type: boolean
          title:
            type: string
        methods:
          - name: RestoreLayout
            parameters:
              - name: name
                type: string
              - name: layout
          - name: SaveLayout
            parameters:
              - name: name
                type: string
              - name: layout
          - name: initialise
          - name: createChildren
          - name: onClose
          - name: setVisible
            parameters:
              - name: visible
                type: boolean
              - name: joypadData
                type: JoypadData
          - name: onClickShowSurvivalGuide
            parameters:
              - name: index
              - name: selected
          - name: onClickList
          - name: prerender
          - name: populateList
          - name: getKeyName
            parameters:
              - name: key
                type: integer
            return:
              - type: string
          - name: doDrawItem
            parameters:
              - name: y
              - name: item
              - name: alt
            return:
              - type: number
          - name: restorePosition
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onKeyRelease
            parameters:
              - name: key
                type: integer
          - name: isKeyConsumed
            parameters:
              - name: key
                type: integer
            return:
              - type: boolean
        staticMethods:
          - name: openEntry
            parameters:
              - name: entry
          - name: onKeyPressed
            parameters:
              - name: key
                type: integer
          - name: OnGameStart
    functions:
      - name: createSurvivalGuide
