version: "1.1"
languages:
  lua:
    classes:
      SurvivalGuide:
        extends: ISCollapsableWindowJoypad
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"SurvivalGuide"'
          instance:
            type: SurvivalGuide
            nullable: true
        fields:
          listBox:
            type: ISScrollingListBox
          videoRichText:
            type: ISRichTextPanel
          descriptionRichText:
            type: ISRichTextPanel
          showGuideTickBox:
            type: ISTickBox
          closeButton:
            type: ISButton
          previousJoypadFocus:
            type: ISUIElement
            nullable: true
          selectedItem:
            type: umbrella.SurvivalGuide.Entry
            nullable: true
          smallResolution:
            type: boolean
          mediumResolution:
            type: boolean
          title:
            type: string
        methods:
          - name: RestoreLayout
            parameters:
              - name: name
                type: string
              - name: layout
                type: umbrella.ISLayoutManager.Layout
          - name: SaveLayout
            parameters:
              - name: name
                type: string
              - name: layout
                type: umbrella.ISLayoutManager.Layout
          - name: initialise
          - name: createChildren
          - name: onClose
          - name: setVisible
            parameters:
              - name: visible
                type: boolean
              - name: joypadData
                type: JoypadData
          - name: onClickShowSurvivalGuide
            parameters:
              - name: index
                type: integer
              - name: selected
                type: boolean
          - name: onClickList
          - name: prerender
          - name: populateList
          - name: getKeyName
            parameters:
              - name: key
                type: string
            return:
              - type: string
          - name: doDrawItem
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: restorePosition
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onKeyRelease
            parameters:
              - name: key
                type: integer
          - name: isKeyConsumed
            parameters:
              - name: key
                type: integer
            return:
              - type: boolean
        staticMethods:
          - name: openEntry
            parameters:
              - name: entry
                type: SurvivalGuideEntry
          - name: onKeyPressed
            parameters:
              - name: key
                type: integer
          - name: OnGameStart
      umbrella.SurvivalGuide.Entry:
        fields:
          id:
            type: string
          title:
            type: string
          description:
            type: string
            nullable: true
          spiffo:
            type: string
            nullable: true
          video:
            type: string
            nullable: true
          category_image:
            type: string
            nullable: true
          subCategory:
            type: boolean
            nullable: true
    functions:
      - name: createSurvivalGuide
