version: "1.1"
languages:
  lua:
    classes:
      NewGameScreen.ModePanel:
        extends: ISPanel
        local: true
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: target
              - name: callback
        staticFields:
          Type:
            defaultValue: '"ModePanel"'
        fields:
          richText:
            type: ISRichTextPanel
          data:
            nullable: true
          texture:
            nullable: true
          title:
            type: string
            nullable: true
          selected:
            type: boolean
          centerThumbnail:
            type: boolean
          mode: {}
          textureHeight:
            type: number
          textureWidth:
            type: number
          textureX:
            type: number
          borderColorMouseOver:
            type: table
          borderColorInactive:
            type: table
          callback: {}
        methods:
          - name: createChildren
          - name: setData
            parameters:
              - name: data
          - name: updateView
          - name: render
          - name: onMouseMove
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseMoveOutside
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseDoubleClick
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseDown
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseDownRichText
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: setSelected
            parameters:
              - name: val
      NewGameScreen:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"NewGameScreen"'
          defaultGameModeData: {}
          instance:
            type: NewGameScreen
            nullable: true
        fields:
          gameModeData:
            type: table
          dataShift:
            type: number
          inChallengesView:
            type: boolean
          backButton:
            type: ISButton
          nextButton:
            type: ISButton
          modsButton:
            type: ISButton
          titleLabel:
            type: ISLabel
          richText:
            type: ISRichTextPanel
          panels:
            type: table
          selectedItem:
            type: ISLabel
          viewDimensions:
            type: table
          selectedJoypad:
            type: number
          joypadButtons:
            type: ISButton[]
          smallResolution:
            type: boolean
          mediumResolution:
            type: boolean
          nextData:
            type: table
          prevData:
            type: table
        methods:
          - name: clickChallenges
          - name: create
          - name: loadChallenges
          - name: calcViewDimensions
          - name: updatePanels
          - name: onItemDblClick
            parameters:
              - name: item
              - name: x
                type: number
              - name: y
                type: number
          - name: onItemClick
            parameters:
              - name: item
              - name: x
                type: number
              - name: y
                type: number
          - name: updatePreview
          - name: update
          - name: prerender
          - name: setVisible
            parameters:
              - name: visible
                type: boolean
              - name: joypadData
                type: JoypadData
                nullable: true
          - name: onOptionMouseDown
            parameters:
              - name: button
                type: ISButton
              - name: x
                type: number
              - name: y
                type: number
          - name: clickPlay
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onLoseJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirLeft
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDirRight
            parameters:
              - name: joypadData
                type: JoypadData
          - name: selectNewPanel
            parameters:
              - name: index
          - name: findLastPanel
            return:
              - type: number
          - name: onResolutionChange
          - name: onResetLua
            parameters:
              - name: reason
                type: string
          - name: onJoypadBeforeDeactivate
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onKeyRelease
            parameters:
              - name: key
                type: integer
