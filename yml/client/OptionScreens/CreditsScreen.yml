version: "1.1"
languages:
  lua:
    classes:
      CreditsScreen:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"CreditsScreen"'
          instance:
            type: CreditsScreen
            nullable: true
        fields:
          richText:
            type: ISRichTextPanel
          speedButton:
            type: ISButton
          pauseButton:
            type: ISButton
          richTextQuit:
            type: ISRichTextPanel
          fadeIn:
            type: boolean
          currentAlpha:
            type: number
          escapeText:
            type: string
          escapeTextWidth: {}
        methods:
          - name: create
          - name: changeSpeed
          - name: pause
          - name: updateButtonTitles
          - name: updateAutoScroll
            parameters:
              - name: speed
                type: number
          - name: setVisible
            parameters:
              - name: visible
                type: boolean
              - name: joypadData
                type: JoypadData
                nullable: true
          - name: onJoypadDown
            parameters:
              - name: button
                type: integer
              - name: joypadData
                type: JoypadData
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: recalcButtonPosition
            parameters:
              - name: joypadData
                type: JoypadData
          - name: doCreditsText
            return:
              - type: string
          - name: addToMap
            parameters:
              - name: key
                type: integer
              - name: searchKey
              - name: map
              - name: name
                type: string
          - name: doCreditTable
            parameters:
              - name: title
                type: string
              - name: creditTable
            return:
              - type: string
          - name: prerender
          - name: render
          - name: onResolutionChange
        staticMethods:
          - name: onKeyPressed
            parameters:
              - name: key
                type: integer
