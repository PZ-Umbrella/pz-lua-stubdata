version: "1.1"
languages:
  lua:
    classes:
      MultiplayerUI:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"MultiplayerUI"'
          startRefreshTime:
            type: number
            nullable: true
          serverCount:
            nullable: true
          received:
            type: number
            nullable: true
          refreshTime:
            nullable: true
          done:
            defaultValue: "false"
          instance:
            type: MultiplayerUI
            nullable: true
        fields:
          screenShading:
            type: ISMPScreenShading
          backButton:
            type: ISButton
          showIPAddressesTickBox:
            type: ISTickBox
          refreshBtn:
            type: ISButton
          connectBtn:
            type: ISButton
          tabs:
            type: ISMPTabPanel
          leftFavoritesPanel:
            type: ISPanel
          leftInternetPanel:
            type: ISPanel
          rightPanel:
            type: ISPanel
          rightPanelInternal:
            type: ISPanel
          rightPanelFavouritesButton:
            type: ISMPButton
          serverDescription:
            type: ISRichTextPanel
          accountList:
            type: ISScrollingListBox
          filter:
            type: ISTextEntryBox
          filterVersion:
            type: ISTickBox
          filterEmptyServer:
            type: ISTickBox
          filterWhitelistServer:
            type: ISTickBox
          filterPwdProtected:
            type: ISTickBox
          filterFullServer:
            type: ISTickBox
          filterModdedServer:
            type: ISTickBox
          internetList:
            type: ISScrollingListBox
          buttonSortName:
            type: ISButton
          buttonSortPlayer:
            type: ISButton
          buttonSortPing:
            type: ISButton
          created:
            type: boolean
          sortDown:
            type: boolean
          sortType:
            type: string
          serversInList:
            type: boolean
          selectedInternetServer:
            nullable: true
          selectedInternetServerFeatured:
            type: boolean
          selectedInternetServerName1:
            type: string
          selectedInternetServerName2:
            type: string
          selectedAccount:
            nullable: true
          modal:
            type: table
            nullable: true
          listChanged:
            type: boolean
          filterUpdateTimer:
            type: number
          ui_mods:
            type: Texture
          ui_whitelist:
            type: Texture
          ui_passwordOn:
            type: Texture
          ui_passwordOff:
            type: Texture
          ui_emptyServer:
            type: Texture
          ui_fullServer:
            type: Texture
          ui_allVersions:
            type: Texture
          ui_ping:
            type: Texture
          ui_playerCount:
            type: Texture
          ui_filters_1:
            type: Texture
          ui_filters_2:
            type: Texture
          ui_filters_3:
            type: Texture
          ui_filters_4:
            type: Texture
          ui_filters_5:
            type: Texture
          ui_filters_6:
            type: Texture
          ui_details_icon:
            type: Texture
          ui_icon_bg:
            type: Texture
          ui_circle:
            type: Texture
          default_banner:
            type: Texture
          default_bottom_background:
            type: Texture
          ui_players:
            type: Texture
          ui_online:
            type: Texture
          ui_offline:
            type: Texture
          ui_subitem_first:
            type: Texture
          ui_subitem_other:
            type: Texture
          ui_add_icon:
            type: Texture
          ui_open:
            type: Texture
          ui_closed:
            type: Texture
          serverInfoBluePanelColor:
            type: umbrella.RGBA
          serverInfoBlueTextColor:
            type: umbrella.RGBA
          serverInfoGrayTextColor:
            type: umbrella.RGBA
          serverListSelected:
            type: umbrella.RGBA
          serverListItem:
            type: umbrella.RGBA
          progressBarColor:
            type: umbrella.RGBA
          rightPanelMargin:
            type: number
          arrowUp:
            type: Texture
          arrowDown:
            type: Texture
          sortListUpdateTicks:
            type: number
          serverList:
            type: Server[]
        methods:
          - name: initialise
          - name: instantiate
          - name: create
          - name: onTabViewActiveTabChanged
            parameters:
              - name: sender
          - name: onJoypadDown
            parameters:
              - name: button
                type: integer
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown_Descendant
            parameters:
              - name: descendant
              - name: button
                type: integer
              - name: joypadData
                type: JoypadData
          - name: handleTabNavigateButtonDown
            parameters:
              - name: button
                type: ISButton
              - name: joypadData
                type: JoypadData
            return:
              - type: boolean
          - name: onClickSort
            parameters:
              - name: button
                type: ISButton
          - name: onChangeFilter
          - name: onToggleShowIPs
          - name: drawAccountListItem
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: drawInternetListItem
            parameters:
              - name: y
                type: number
              - name: item
                type: umbrella.ISScrollingListBox.Item
              - name: alt
                type: boolean
            return:
              - type: number
          - name: getServerFeatured
            parameters:
              - name: server
                type: Server
            return:
              - type: umbrella.MultiplayerUI.AccountListItem
                nullable: true
          - name: onSelectInternetServer
            parameters:
              - name: server
                type: Server
          - name: selectInternetServer
            parameters:
              - name: server
                type: Server
          - name: onDoubleClickInternetList
            parameters:
              - name: server
                type: Server
          - name: onSelectAccount
            parameters:
              - name: _item
                type: umbrella.MultiplayerUI.AccountListItem
          - name: onDeleteAccount
            parameters:
              - name: button
                type: ISButton
              - name: account
                type: Account
          - name: onDeleteServer
            parameters:
              - name: button
                type: ISButton
              - name: server
                type: Server
          - name: onPressButtonOnAccountList
            parameters:
              - name: button
                type: ISButton
              - name: x
                type: number
              - name: y
                type: number
          - name: connectToServer
            parameters:
              - name: server
                type: Server
              - name: account
                type: Account
          - name: refreshList
          - name: requestServerList
          - name: analyzeServerData
            parameters:
              - name: server
                type: Server
          - name: onResolutionChange
            parameters:
              - name: oldw
                type: number
              - name: oldh
                type: number
              - name: neww
                type: number
              - name: newh
                type: number
          - name: prerender
          - name: updateButtons
          - name: render
          - name: drawTickboxIcons
            parameters:
              - name: texture
                type: Texture
              - name: x
                type: number
              - name: y
                type: number
              - name: scale
                type: number
            return:
              - type: number
          - name: updateListSort
          - name: sortInternetList
          - name: sortServerList
            parameters:
              - name: a
                type: umbrella.ISScrollingListBox.Item
              - name: b
                type: umbrella.ISScrollingListBox.Item
            return:
              - type: boolean
                nullable: true
          - name: renderSortButtons
          - name: onMouseDown_Tabs
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onOptionMouseDown
            parameters:
              - name: button
                type: ISButton
              - name: x
                type: number
              - name: y
                type: number
          - name: connectFromBrowser
            parameters:
              - name: server
                type: Server
          - name: checkServerIsPwdProtected
            parameters:
              - name: server
                type: Server
              - name: connectAfter
                type: boolean
              - name: addToFavAfter
                type: boolean
            return:
              - type: boolean
                nullable: true
        staticMethods:
          - name: onTextFilterChange
            parameters:
              - name: box
                type: ISTextEntryBox
          - name: onDoubleClickAccount
            parameters:
              - name: accountList
                type: ISScrollingListBox
              - name: x
                type: number
              - name: y
                type: number
          - name: ServerPinged
            parameters:
              - name: ip
                type: string
              - name: users
                type: string
          - name: OnSteamServerResponded
            parameters:
              - name: serverIndex
                type: integer
          - name: OnSteamServerResponded2
            parameters:
              - name: host
                type: string
              - name: port
                type: number
              - name: server2
                type: Server
          - name: OnSteamServerFailedToRespond2
            parameters:
              - name: host
                type: string
              - name: port
                type: number
          - name: OnSteamRulesRefreshComplete
            parameters:
              - name: host
                type: string
              - name: port
                type: number
              - name: rules
                type: umbrella.ServerProperties
          - name: OnSteamRefreshInternetServers
          - name: onResetLua
            parameters:
              - name: reason
                type: string
      umbrella.MultiplayerUI.AccountListItem:
        fields:
          type:
            type: "'account' | 'server' | 'new_account' | 'new_server'"
          first:
            type: boolean
            nullable: true
          server:
            type: Server
            nullable: true
          account:
            type: Account
            nullable: true
          deleteButton:
            type: ISButton
            nullable: true
          editButton:
            type: ISButton
            nullable: true
          connectButton:
            type: ISButton
            nullable: true
