version: "1.1"
languages:
  lua:
    classes:
      GameOption:
        extends: ISBaseObject
        constructors:
          - parameters:
              - name: name
                type: string
              - name: control
                type: ISUIElement
                nullable: true
              - name: arg1
                type: unknown
                nullable: true
              - name: arg2
                type: unknown
                nullable: true
        staticFields:
          Type:
            defaultValue: '"GameOption"'
        fields:
          name:
            type: string
          control:
            type: ISUIElement
            nullable: true
          arg1:
            type: unknown
            nullable: true
          arg2:
            type: unknown
            nullable: true
        methods:
          - name: storeCurrentValue
          - name: restoreOriginalValue
          - name: toUI
          - name: apply
          - name: resetLua
          - name: restartRequired
            parameters:
              - name: oldValue
                type: any
              - name: newValue
                type: any
          - name: invokeOnChangeEvent
          - name: onChangeComboBox
            parameters:
              - name: box
                type: ISComboBox
          - name: onChangeSlider
            parameters:
              - name: value
                type: number
              - name: control
                type: ISSliderPanel
          - name: onChangeTickBox
            parameters:
              - name: index
                type: integer
              - name: selected
                type: boolean
          - name: onChangeVolumeControl
            parameters:
              - name: control
                type: ISVolumeControl
              - name: volume
                type: number
      GameOptions:
        extends: ISBaseObject
        constructors:
          - {}
        staticFields:
          Type:
            defaultValue: '"GameOptions"'
        fields:
          changed:
            type: boolean
          options:
            type: GameOption[]
        methods:
          - name: add
            parameters:
              - name: option
                type: GameOption
            return:
              - type: boolean
          - name: tryAdd
            parameters:
              - name: option
                type: GameOption
            return:
              - type: boolean
          - name: containsOption
            parameters:
              - name: option
                type: GameOption
            return:
              - type: boolean
          - name: remove
            parameters:
              - name: option
                type: GameOption
            return:
              - type: boolean
          - name: tryRemove
            parameters:
              - name: option
                type: GameOption
            return:
              - type: boolean
          - name: addAllFromUIElement
            parameters:
              - name: uiRootElement
                type: ISUIElement
          - name: addFromUIElement
            parameters:
              - name: uiElement
                type: ISUIElement
          - name: removeAllFromUIElement
            parameters:
              - name: uiRootElement
                type: ISUIElement
          - name: removeFromUIElement
            parameters:
              - name: uiElement
                type: ISUIElement
          - name: get
            parameters:
              - name: optionName
                type: string
            return:
              - type: GameOption
                nullable: true
          - name: apply
          - name: storeCurrentValues
          - name: restoreOriginalValues
          - name: toUI
          - name: onChange
            parameters:
              - name: option
                type: GameOption
