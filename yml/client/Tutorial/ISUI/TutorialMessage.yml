version: "1.1"
languages:
  lua:
    classes:
      TutorialMessage:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: clickToSkip
                type: boolean
                nullable: true
              - name: message
                type: string
        staticFields:
          Type:
            defaultValue: '"TutorialMessage"'
          instance:
            type: TutorialMessage
            nullable: true
          spiffo:
            type: Texture
        fields:
          richtext:
            type: ISRichTextPanel
          test:
            nullable: true
          message:
            type: string
            nullable: true
          clickToSkip:
            type: boolean
          timer:
            type: number
          clicktoSkip:
            type: boolean
        methods:
          - name: initialise
          - name: createChildren
          - name: updateSize
          - name: setInfo
            parameters:
              - name: item
          - name: onMouseWheel
            parameters:
              - name: del
                type: number
            return:
              - type: boolean
          - name: update
          - name: render
          - name: onGainJoypadFocus
            parameters:
              - name: joypadData
                type: JoypadData
          - name: onJoypadDown
            parameters:
              - name: button
                type: JoypadButton
        staticMethods:
          - name: onKeyPressed
            parameters:
              - name: key
                type: integer
          - name: getInstance
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: w
                type: number
              - name: h
                type: number
              - name: message
                type: string
              - name: clickToSkip
                type: boolean
                nullable: true
              - name: target
                type: unknown
                nullable: true
              - name: test
                type: boolean
                nullable: true
            return:
              - type: TutorialMessage
