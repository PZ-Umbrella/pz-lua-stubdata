version: "1.1"
languages:
  lua:
    classes:
      FireBrushUI:
        extends: ISPanelJoypad
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
              - name: player
                type: IsoPlayer
        staticFields:
          Type:
            defaultValue: '"FireBrushUI"'
          instance:
            type: FireBrushUI
            nullable: true
        fields:
          brushType:
            type: ISRadioButtons
          addByClick:
            type: ISButton
          removeByClick:
            type: ISButton
          addByArea:
            type: ISButton
          removeByArea:
            type: ISButton
          close:
            type: ISButton
          currentButton:
            type: ISButton
            nullable: true
          selectByClick:
            type: boolean
          isAdd:
            type: boolean
          selectStart:
            type: boolean
          selectEnd:
            type: boolean
          zPos:
            type: number
          startPos:
            type: "{ x: integer, y: integer }"
            nullable: true
          endPos:
            type: "{ x: integer, y: integer }"
            nullable: true
          player:
            type: IsoPlayer
          playerNum:
            type: integer
          titlebarbkg:
            type: Texture
        methods:
          - name: initialise
          - name: destroy
          - name: onClick
            parameters:
              - name: button
                type: ISButton
          - name: disableCurrentButton
          - name: prerender
          - name: render
          - name: onMouseMove
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseMoveOutside
            parameters:
              - name: dx
                type: number
              - name: dy
                type: number
          - name: onMouseDown
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseUp
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: onMouseUpOutside
            parameters:
              - name: x
                type: number
              - name: y
                type: number
          - name: applyOnSquare
            parameters:
              - name: sq
                type: IsoGridSquare
          - name: applyOnArea
          - name: addFire
            parameters:
              - name: square
                type: IsoGridSquare
          - name: removeFire
            parameters:
              - name: square
                type: IsoGridSquare
          - name: addSmoke
            parameters:
              - name: square
                type: IsoGridSquare
          - name: removeSmoke
            parameters:
              - name: square
                type: IsoGridSquare
          - name: addExplosion
            parameters:
              - name: square
                type: IsoGridSquare
          - name: onMouseDownOutside
            parameters:
              - name: x
                type: number
              - name: y
                type: number
        staticMethods:
          - name: openPanel
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: playerObj
                type: IsoPlayer
