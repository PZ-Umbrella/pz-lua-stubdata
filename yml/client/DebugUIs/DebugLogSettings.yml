version: "1.1"
languages:
  lua:
    classes:
      DebugLogSettings:
        extends: ISCollapsableWindow
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
              - name: height
                type: number
        staticFields:
          Type:
            defaultValue: '"DebugLogSettings"'
        fields:
          comboSetAll:
            type: ISComboBox
          comboLookup:
            type: table<DebugType, ISComboBox>
        methods:
          - name: onComboBox
            parameters:
              - name: comboBox
                type: ISComboBox
              - name: debugType
                type: DebugType
          - name: onSetProfile
            parameters:
              - name: comboBox
                type: ISComboBox
          - name: onSetAll
            parameters:
              - name: comboBox
                type: ISComboBox
          - name: onSave
            parameters:
              - name: button
                type: ISButton
          - name: createChildren
          - name: setVisible
            parameters:
              - name: bVisible
                type: boolean
          - name: syncCombos
          - name: onMouseDownOutside
            parameters:
              - name: x
                type: number
              - name: y
                type: number
      DebugLogSettings.HorizontalLine:
        extends: ISPanel
        local: true
        constructors:
          - parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: width
                type: number
        staticFields:
          Type:
            defaultValue: '"HorizontalLine"'
        methods:
          - name: prerender
          - name: render
