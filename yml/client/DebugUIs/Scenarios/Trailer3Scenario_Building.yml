version: "1.1"
languages:
  lua:
    classes:
      debugScenarios.Trailer3Scenario_Building:
        local: true
        staticFields:
          name:
            defaultValue: '"LIFE 3 - FINAL HOUSE SURVIVE"'
          startLoc: {}
        staticMethods:
          - name: setSandbox
          - name: onStart
          - name: onLoadGS
            parameters:
              - name: sq
                type: IsoGridSquare
          - name: addFloor
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
          - name: addStairs
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: north
                type: boolean
                nullable: true
          - name: addFence
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
              - name: north
                type: boolean
          - name: addWallFrame
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
              - name: north
                type: boolean
          - name: addWall
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
              - name: north
                type: boolean
          - name: addDoor
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
              - name: openTile
                type: string
              - name: north
                type: boolean
          - name: addItem
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
              - name: tile
                type: string
          - name: getSQ
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
            return:
              - type: IsoGridSquare
          - name: removeItemsButFloor
            parameters:
              - name: x
                type: number
              - name: y
                type: number
              - name: z
                type: number
      debugScenarios:
        staticFields:
          Trailer3Scenario_Building:
            type: debugScenarios.Trailer3Scenario_Building
