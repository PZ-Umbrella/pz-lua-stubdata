version: "1.1"
languages:
  lua:
    classes:
      forageClient:
        staticMethods:
          - name: init
          - name: updateData
          - name: clearData
          - name: syncForageData
          - name: addZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: removeZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: updateZone
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
          - name: updateIcon
            parameters:
              - name: _zoneData
                type: umbrella.Foraging.ZoneData
              - name: _iconID
                type: string
              - name: _icon
                type: umbrella.Foraging.ZoneIconData
                nullable: true
          - name: requestZone
            parameters:
              - name: _character
                type: IsoPlayer
          - name: showForageHalo
            parameters:
              - name: _character
                type: IsoPlayer
              - name: _itemList
                type: ArrayList<InventoryItem>
      forageData:
        fields:
          "[string]":
            type: umbrella.Foraging.ZoneData
